name: Deploy Spring Boot to EC2

on:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Gradle
      run: ./gradlew bootJar -x test

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh

        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

    - name: Copy JAR to EC2 via SCP
      run: |
        ssh -i ~/.ssh/deploy_key \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ec2-user@${{ secrets.EC2_HOST }} \
          'mkdir -p /home/ec2-user/app'

        scp -i ~/.ssh/deploy_key \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          build/libs/*.jar \
          ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/app/

    - name: Restart Spring Boot App via SSH
      run: |
        ssh -i ~/.ssh/deploy_key \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ec2-user@${{ secrets.EC2_HOST }} '
            set -e

            echo "======================================"
            echo "Verificando Java..."
            echo "======================================"

            if ! command -v java >/dev/null 2>&1; then
              echo "ERROR: Java no está instalado en la EC2."
              echo "Debes instalar Java 21 en la instancia."
              exit 1
            fi

            java -version

            echo "======================================"
            echo "Deteniendo aplicación anterior..."
            echo "======================================"

            sudo fuser -k 8080/tcp || true

            sleep 3

            echo "======================================"
            echo "Buscando JAR..."
            echo "======================================"

            JAR=$(ls -t /home/ec2-user/app/*.jar | head -n 1)

            if [ -z "$JAR" ]; then
              echo "ERROR: No se encontró ningún JAR."
              exit 1
            fi

            echo "JAR encontrado:"
            echo "$JAR"

            echo "======================================"
            echo "Iniciando Spring Boot..."
            echo "======================================"

            nohup java -jar "$JAR" \
              > /home/ec2-user/app/app.log 2>&1 \
              < /dev/null &

            echo $! > /home/ec2-user/app/app.pid

            sleep 8

            PID=$(cat /home/ec2-user/app/app.pid)

            if ! kill -0 "$PID" 2>/dev/null; then

              echo "======================================"
              echo "ERROR: Spring Boot no pudo iniciar"
              echo "======================================"

              echo "Contenido de app.log:"
              echo "--------------------------------------"

              cat /home/ec2-user/app/app.log

              echo "--------------------------------------"

              exit 1
            fi

            echo "======================================"
            echo "DEPLOY COMPLETADO CORRECTAMENTE"
            echo "======================================"

            echo "PID: $PID"
            echo "Puerto: 8080"

            exit 0
          '